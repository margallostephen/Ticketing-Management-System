services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    depends_on:
      - mysql
      - redis
      - mailpit
    networks:
      - tms

  nginx:
    image: nginx:alpine
    container_name: tms-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tms

  mysql:
    image: mysql:8.4
    container_name: tms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tms

  redis:
    image: redis:7-alpine
    container_name: tms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - tms

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tms-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - tms

  mailpit:
    image: axllent/mailpit:latest
    container_name: tms-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "8025:8025"
    networks:
      - tms

networks:
  tms:

volumes:
  mysql_data:
  redis_data: